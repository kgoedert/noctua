version: "3"
networks:
  noctua:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg17
    volumes:
      - /extra/apps/noctua/postgres-data:/var/lib/postgresql/data:rw
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=padrao
    networks:
      - noctua